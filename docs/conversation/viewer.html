<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session — Sovereign Build</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    color: #d4d4d4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: #0f0f0f;
    border-bottom: 1px solid #222;
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 13px; font-weight: 600; color: #888; letter-spacing: 0.06em; text-transform: uppercase; }
  #count { font-size: 12px; color: #555; }

  #log {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    display: flex; flex-direction: column; gap: 2px;
  }

  .msg {
    padding: 14px 18px;
    border-radius: 6px;
    max-width: 100%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.human {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    color: #a8b4d8;
    margin-left: 80px;
  }
  .msg.assistant {
    background: #1a1a1a;
    border: 1px solid #252525;
    color: #c8c8c8;
    margin-right: 80px;
  }
  .msg-role {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .msg.human .msg-role { color: #6272a4; }
  .msg.assistant .msg-role { color: #50fa7b; }

  .msg-body { font-size: 13.5px; line-height: 1.65; }

  /* Inline code */
  .msg-body code {
    background: #2a2a2a;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
    color: #f1fa8c;
  }

  /* Code blocks */
  .msg-body pre {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 12px 14px;
    margin: 8px 0;
    overflow-x: auto;
  }
  .msg-body pre code {
    background: none; border: none; padding: 0;
    font-size: 12px; color: #e0e0e0;
  }

  #loading {
    text-align: center;
    padding: 80px 24px;
    color: #555;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Sovereign — Build Session · 2026-05-21</h1>
  <span id="count"></span>
</header>

<div id="log"><div id="loading">Loading conversation...</div></div>

<script>
async function load() {
  const res = await fetch('/docs/conversation/session-2026-05-21.jsonl');
  const text = await res.text();
  const lines = text.trim().split('\n').filter(Boolean);

  const messages = [];
  for (const line of lines) {
    try {
      const obj = JSON.parse(line);
      // Claude Code JSONL format: type = "user" | "assistant"
      const role = obj.type || obj.role;
      if (role !== 'user' && role !== 'assistant') continue;

      // Extract text content from message
      let content = '';
      const msg = obj.message || obj;
      if (typeof msg.content === 'string') {
        content = msg.content;
      } else if (Array.isArray(msg.content)) {
        content = msg.content
          .filter(b => b.type === 'text')
          .map(b => b.text)
          .join('\n');
      } else if (typeof obj.content === 'string') {
        content = obj.content;
      } else if (Array.isArray(obj.content)) {
        content = obj.content
          .filter(b => b.type === 'text')
          .map(b => b.text)
          .join('\n');
      }

      if (content.trim()) messages.push({ role, content: content.trim() });
    } catch {}
  }

  const log = document.getElementById('log');
  log.innerHTML = '';

  if (messages.length === 0) {
    log.innerHTML = '<div id="loading">No messages found — the JSONL format may differ. Try opening the raw file in VS Code.</div>';
    return;
  }

  document.getElementById('count').textContent = `${messages.length} messages`;

  for (const { role, content } of messages) {
    const div = document.createElement('div');
    div.className = `msg ${role === 'user' ? 'human' : 'assistant'}`;

    const label = document.createElement('div');
    label.className = 'msg-role';
    label.textContent = role === 'user' ? 'You' : 'Claude';

    const body = document.createElement('div');
    body.className = 'msg-body';
    body.innerHTML = formatContent(content);

    div.appendChild(label);
    div.appendChild(body);
    log.appendChild(div);
  }
}

function formatContent(text) {
  // Escape HTML
  text = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Code blocks
  text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Line breaks
  text = text.replace(/\n/g, '<br>');
  return text;
}

load().catch(err => {
  document.getElementById('log').innerHTML =
    `<div id="loading">Failed to load: ${err.message}</div>`;
});
</script>
</body>
</html>
